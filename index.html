<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marqidian Technologies, Inc. — Coming soon</title>
<meta name="description" content="Marqidian Technologies, Inc. Our new website is coming soon.">
<meta name="robots" content="noindex">
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --black:#000; --white:#fff; --gray:#9a9898; --line:#262626; --coral:#FF5C69; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body {
    background:var(--black); color:var(--white);
    font-family:Inter, ui-sans-serif, system-ui, sans-serif;
    display:flex; flex-direction:column; min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  main { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
         padding:48px 24px; text-align:center; }
  .logo { width:min(560px, 86vw); height:auto; opacity:0; animation:rise .9s ease-out .1s forwards; }
  .rule { width:56px; height:2px; background:var(--coral); margin:40px auto 28px; opacity:0;
          animation:rise .9s ease-out .35s forwards; }
  h1 { font-size:clamp(14px, 2.2vw, 16px); font-weight:600; letter-spacing:.32em; text-transform:uppercase;
       opacity:0; animation:rise .9s ease-out .5s forwards; }
  p.lead { margin-top:14px; color:var(--gray); font-size:15px; line-height:1.6; max-width:420px;
           opacity:0; animation:rise .9s ease-out .65s forwards; }
  a.contact { display:inline-flex; align-items:center; gap:10px; margin-top:32px; padding:12px 20px;
              border:1px solid var(--line); border-radius:999px; color:var(--white); text-decoration:none;
              font-size:14px; font-weight:500; transition:border-color .2s, color .2s;
              opacity:0; animation:rise .9s ease-out .8s forwards; }
  a.contact:hover, a.contact:focus-visible { border-color:var(--coral); color:var(--coral); outline:none; }
  a.contact svg { width:16px; height:16px; }
  footer { padding:24px; text-align:center; color:#6b6969; font-size:12px; border-top:1px solid #111; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce) { .logo,.rule,h1,p.lead,a.contact { animation:none; opacity:1; } }
</style>
</head>
<body>
  <main>
    <img class="logo" src="logo.png" alt="Marqidian Technologies, Inc." width="1200" height="331">
    <div class="rule" aria-hidden="true"></div>
    <h1>Coming soon</h1>
    <p class="lead">Our new website is on its way.</p>
    <a class="contact" href="mailto:info@marqidian.com">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      info@marqidian.com
    </a>
  </main>
  <footer>© 2026 Marqidian Technologies, Inc. All rights reserved.</footer>
</body>
</html>
